name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Catalog invariants (AGENTS.md)
        run: |
          pip install --quiet "pyyaml>=6"
          python scripts/check.py
      - name: Python scripts compile
        run: git ls-files -z '*.py' | xargs -0 python -m py_compile
      - name: Shell scripts
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck
